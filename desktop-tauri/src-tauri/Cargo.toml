[package]
name = "friend-tauri"
version = "0.1.0"
edition = "2021"
description = "Mira — живой компаньон на рабочем столе (оболочка Tauri)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Демо (--demo): кадры со страницы кодируются в docs/mira-hero.gif.
gif = "0.13"
base64 = "0.22"

[profile.release]
strip = true
lto = true
